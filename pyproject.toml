[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-transcribe-mcp"
version = "1.1.2"
description = "MCP server for audio transcription via faster-whisper (local) or OpenAI Whisper API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yohan González Almaguer" }]
keywords = ["mcp", "whisper", "transcription", "audio", "ai", "speech-to-text"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastmcp>=3.2.0",
    "mcp>=1.28.1",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
openai = ["openai>=1.0"]
all = ["faster-whisper>=1.0", "openai>=1.0"]

[project.scripts]
whisper-transcribe-mcp = "whisper_transcribe.server:main"

[project.urls]
Homepage = "https://github.com/ZahiriNatZuke/whisper-transcribe-mcp"
Repository = "https://github.com/ZahiriNatZuke/whisper-transcribe-mcp"
Issues = "https://github.com/ZahiriNatZuke/whisper-transcribe-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["whisper_transcribe"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# onnxruntime (pulled in by faster-whisper) dropped CPython 3.10 wheels in 1.24.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]
