name: Publish

# One-time PyPI setup: trusted publisher for owner ZahiriNatZuke,
# repository whisper-transcribe-mcp, workflow publish.yml, environment pypi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag to publish or retry (for example v1.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.10"

      - name: Check lockfile and sync development dependencies
        run: |
          uv lock --check
          uv sync --group dev

      - name: Validate tag and Registry metadata
        run: |
          curl --fail --silent --show-error \
            https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            --output /tmp/server.schema.json
          uv run python scripts/check_release_metadata.py \
            --tag "$RELEASE_TAG" \
            --schema /tmp/server.schema.json

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Build package
        run: uv build

      - name: Check whether the version already exists on PyPI
        id: pypi
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if curl --max-time 20 --fail --silent --show-error \
            "https://pypi.org/pypi/whisper-transcribe-mcp/${version}/json" \
            >/dev/null; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      # Trusted Publishing (OIDC) plus PEP 740 provenance attestations for every artifact.
      - name: Publish to PyPI with Trusted Publishing
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

      - name: Wait for PyPI metadata
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..12}; do
            published="$(curl --fail --silent --show-error \
              https://pypi.org/pypi/whisper-transcribe-mcp/json | jq -r '.info.version' || true)"
            if [[ "$published" == "$version" ]]; then
              exit 0
            fi
            echo "PyPI reports ${published:-no version}; waiting for $version (attempt $attempt/12)"
            sleep 10
          done
          echo "PyPI did not expose $version before the timeout" >&2
          exit 1

      - name: Install verified mcp-publisher
        shell: bash
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher

      - name: Publish to the official MCP Registry
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          registry_json="$(curl --max-time 20 --fail --silent --show-error \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.ZahiriNatZuke%2Fwhisper-transcribe-mcp' \
            || true)"
          if jq --exit-status --arg version "$version" \
            '.servers[]?.server | select(.name == "io.github.ZahiriNatZuke/whisper-transcribe-mcp" and .version == $version)' \
            <<<"$registry_json" >/dev/null; then
            echo "MCP Registry already contains version $version; skipping."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
